<!-- URL Input Area -->
<div class="max-w-3xl mx-auto flex flex-col md:flex-row gap-2">
        <div class="relative flex-grow group">
                <span
                        class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">link</span>
                <input class="w-full h-14 pl-12 pr-4 bg-surface-container border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-on-surface-variant/50 text-on-surface font-body-md"
                        [placeholder] =  "placeholderText()"
                        type="text">
        </div>
        <button
                class="h-14 px-10 bg-primary-container hover:bg-opacity-90 text-on-primary-container font-headline-lg-mobile rounded-lg transition-all active:scale-95 shadow-lg flex items-center justify-center gap-2">
                {{ fetchText() }}
                <span class="material-symbols-outlined">search</span>
        </button>
</div>
